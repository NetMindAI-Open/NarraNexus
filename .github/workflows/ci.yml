name: CI

# `dev` is included deliberately. The release workflow in CLAUDE.md (step 2)
# already promises "feature-branch CI", but with main-only triggers a PR into
# dev — which is every feature PR — ran none of this. The only checks such a PR
# got were the PR-title lint, the mirror-md sync check and the welcome bot, so
# every "tests green / tsc clean" claim rested on the author's local run with no
# way for a reviewer to re-check it. Cost is CI minutes per dev PR.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend checks ──────────────────────────────────────────────────────
  backend:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check src/ backend/

  # ── Frontend checks ─────────────────────────────────────────────────────
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint || echo "::warning::ESLint has pre-existing issues — not blocking CI yet"

      - name: Unit tests
        # Nothing in CI ran vitest before 2026-07-30, which made the
        # `no-native-dialogs` contract test (added the same day) enforceable only
        # by whoever remembered to run it locally. A ban nobody executes is a
        # comment.
        run: npm test

      - name: Build
        run: npm run build
