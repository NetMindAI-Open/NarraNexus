name: Build Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (system — for frontend build inside the script)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup uv
        # build-desktop.sh installs the project into the bundled standalone
        # interpreter with `uv pip install`. It CANNOT be plain pip: the 30
        # workspace members (narranexus-contracts / -sdk / 28 plugins) resolve
        # only through `[tool.uv.sources]`, a uv-only table. Without this step
        # the script dies at "uv: command not found".
        uses: astral-sh/setup-uv@v4
        # Pinned. Step 3 of build-desktop.sh runs `uv export --locked`, which
        # asserts uv.lock would not change — so which uv runs is part of the
        # build contract, not an implementation detail. An unpinned setup-uv
        # that one day bumps the lock format would fail this job AFTER the tag
        # is pushed, which is the most expensive place to find out. Keep in
        # lockstep with ci.yml. The cloud images are a separate question and
        # not covered by this pin: they install through `uv sync --frozen`,
        # which no `--locked` assertion rides on.
        with:
          version: "0.12.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Install Tauri CLI
        # macos-14 runner regressions guarded for here:
        #
        # 1. `~/.cargo/bin/{cargo,rustc,...}` are all rustup-init shims
        #    that re-exec `rustup-init` when no toolchain is "active
        #    for the current invocation". `cargo install` fails with
        #    "unexpected argument 'install' found"; if we work around
        #    that and invoke the real cargo, cargo's own `rustc -vV`
        #    probe (to discover the host triple) ALSO hits the shim
        #    and returns `rustup-init 1.29.0 ...`, breaking cargo with
        #    "rustc -vV didn't have a line for `host:`".
        #
        #    Fix: resolve the toolchain's bin dir explicitly with
        #    `rustup which` and prepend it to PATH. Now every shelled-
        #    out `cargo` / `rustc` call — by us, by build scripts, by
        #    cargo itself — finds the real binaries first.
        #
        # 2. cargo-install can trigger a `rustup component add rust-src`
        #    mid-compile, and that download intermittently fails on
        #    the runner's APFS (the `.partial` file gets unlinked
        #    before rename, "No such file or directory (os error 2)").
        #    Pre-install rust-src in its own step with a 3x retry so
        #    we don't gamble on it inside `cargo install`.
        #
        # `set -eux` echoes resolved paths so a future runner shift is
        # debuggable from the CI log alone.
        run: |
          set -eux
          rustup default stable
          for i in 1 2 3; do
            rustup component add rust-src --toolchain stable && break
            echo "rustup component add rust-src failed (attempt $i), retrying…"
            sleep 5
          done
          TOOLCHAIN_BIN="$(dirname "$(rustup which --toolchain stable cargo)")"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          # Persist across subsequent steps (Build/sign/notarize also calls
          # cargo + rustc indirectly via `cargo tauri build`).
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          which cargo
          which rustc
          rustc -vV
          # --locked + exact version. tauri-cli 2.12.x (2.12.2 included) depends on
          # `zip = "^8"`, and every zip 8.x release is yanked on crates.io, so a
          # fresh resolve fails before compiling (the v1.21.7 tag build, 2026-10-16).
          # --locked is what fixes it: it installs from the crate's own bundled
          # Cargo.lock, which pins zip 8.0.0, and yanked versions already pinned in a
          # lockfile still resolve. The exact version adds reproducibility: 2.12.2
          # is what built v1.21.6. Keep it in lockstep with the @tauri-apps/cli pin
          # in the updater-signing step below.
          cargo install tauri-cli --version "=2.12.2" --locked

      # Import the Developer ID cert into a temp keychain so build-desktop.sh's
      # `codesign --sign "$APPLE_SIGNING_IDENTITY"` calls can find it.
      # The script itself doesn't import — it's optimised for local builds on a
      # Mac where the cert already lives in the user's login keychain. CI has
      # no such keychain, so we set one up here and tear it down on cleanup.
      #
      # `set-key-partition-list` is the macOS 10.12+ ACL that lets codesign
      # use the imported key without an interactive password prompt.
      - name: Import Apple Developer ID certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Prepend the build keychain to the search list so codesign finds
          # the identity. We do NOT replace the default keychain — System.keychain
          # must stay reachable for trust evaluation of Apple's intermediate certs.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

          echo "--- codesigning identities found ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # Single source of truth for desktop builds. The script:
      #   - builds frontend
      #   - downloads standalone Python (with SHA256 verify) into resources/python/
      #   - installs project (NON-editable) into that Python so the bundle is relocatable
      #   - downloads Node.js (with SHA256 verify) into resources/nodejs/
      #   - npm ci installs claude-code + lark-cli into resources/nodejs/node_modules/
      #   - rewrites bundled bin shims to bash so Tauri's bundler can't break them
      #   - npx-installs the Lark skill pack into resources/lark-skills/
      #   - rsyncs project source into resources/project/ with the correct excludes
      #   - cargo tauri build (which assembles the .app)
      #   - manually codesigns inner Mach-O + outer bundle with hardened runtime
      #   - runs scripts/release/pre-notarize-audit.sh
      #   - submits to Apple notary, polls, downloads log, staples ticket to dmg
      #
      # Apple env vars are CONSUMED inside step 6/7/8 of the script. If any
      # signing/notarize var is missing the script falls back to ad-hoc.
      - name: Build, sign, notarize via canonical script
        run: bash scripts/release/build-desktop.sh
        env:
          # Cert + cert-password are consumed by the prior keychain-import
          # step, not by this script — passing them again would make Tauri's
          # bundler try to re-import into a second temp keychain.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # NetMind ("Power") account login in the shipped DMG. All wired to repo
          # Variables (Settings → Variables), pointing at PROD NetMind. The
          # frontend VITE_* are baked by vite here; the backend vars are baked
          # into the launcher via option_env! (both read from this step's env).
          # scripts/release/check_desktop_netmind_env.sh runs first inside the
          # script and fails the build on a missing, mismatched, or non-prod
          # (protago-dev, test.*) value, then scans the built frontend for any
          # protago-dev reference. On a tag (a public release) Power login is
          # REQUIRED: if the Variables vanish the release goes red instead of
          # silently shipping without Power login. A workflow_dispatch test
          # build may leave them unset (pure-local, username-only).
          NARRANEXUS_REQUIRE_POWER_LOGIN: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || '' }}
          VITE_ENABLE_POWER_LOGIN: ${{ vars.VITE_ENABLE_POWER_LOGIN }}
          VITE_NETMIND_AUTH_API: ${{ vars.VITE_NETMIND_AUTH_API }}
          VITE_NETMIND_ACCOUNTS_URL: ${{ vars.VITE_NETMIND_ACCOUNTS_URL }}
          VITE_NETMIND_SYS_CODE: ${{ vars.VITE_NETMIND_SYS_CODE }}
          VITE_NETMIND_REGISTER_URL: ${{ vars.VITE_NETMIND_REGISTER_URL }}
          NARRANEXUS_ENABLE_POWER_LOGIN: ${{ vars.NARRANEXUS_ENABLE_POWER_LOGIN }}
          NETMIND_USE_SUBSCRIPTION_ENABLED: ${{ vars.NETMIND_USE_SUBSCRIPTION_ENABLED }}
          NETMIND_AUTH_API_URL: ${{ vars.NETMIND_AUTH_API_URL }}
          BILLING_API_BASE: ${{ vars.BILLING_API_BASE }}
          NETMIND_KEY_API_BASE: ${{ vars.NETMIND_KEY_API_BASE }}
          NETMIND_INFERENCE_BASE: ${{ vars.NETMIND_INFERENCE_BASE }}

      # The only check that sees what a USER sees. Everything before this runs
      # on the build machine, where the source checkout exists — so a bundle that
      # silently depends on that checkout passes every earlier gate. v1.21.3 did
      # exactly that: its workspace packages were editable `.pth` hooks into
      # /Users/runner/work/..., the import smoke on this runner was green, and
      # every user's app died with `No module named 'narranexus.contracts'`.
      # So: copy the final, signed .app out, move the whole checkout out of the
      # way, give the sidecars the environment a Finder launch gives them, and
      # bring all four up exactly as state.rs does, in its order — sqlite_proxy
      # (:8100), backend (:8000, /docs must answer 200), mcp (:7801), workers
      # (:47831/healthz must answer 200, then stay alive). Any dependency on the
      # build machine's filesystem or environment that those four startups
      # exercise fails here — before either upload.
      # Plain variables, no arrays/eval: the runner's /bin/bash may be 3.2.
      - name: Verify the shipped app starts without the source tree
        run: |
          set -euo pipefail
          APP_SRC="$GITHUB_WORKSPACE/tauri/src-tauri/target/release/bundle/macos/NarraNexus.app"
          [ -d "$APP_SRC" ] || { echo "::error::NarraNexus.app not found at $APP_SRC"; exit 1; }
          VERIFY="$RUNNER_TEMP/relocated"
          rm -rf "$VERIFY" && mkdir -p "$VERIFY/home"
          ditto "$APP_SRC" "$VERIFY/NarraNexus.app"

          # Hide the checkout; on the way out stop every sidecar and put the
          # checkout back — later steps (and the post-job cleanup) need it.
          HIDDEN="$GITHUB_WORKSPACE.hidden-for-verify"
          PIDS=""   # space-separated pid:name pairs
          restore() {
            for entry in $PIDS; do kill "${entry%%:*}" 2>/dev/null || true; done
            sleep 2
            for entry in $PIDS; do kill -9 "${entry%%:*}" 2>/dev/null || true; done
            if [ -d "$HIDDEN" ]; then mv "$HIDDEN" "$GITHUB_WORKSPACE"; fi
            # Only the large uncompressed .app copy goes. The sidecar logs stay
            # on disk for the next step, which uploads them as an artifact if
            # this one failed; fail() also prints the failing sidecar's log here.
            rm -rf "$VERIFY/NarraNexus.app"
          }
          # INT/TERM restore AND exit (a bare handler would return and let the
          # script run on with the checkout already moved back); EXIT covers
          # every normal and `set -e` path.
          trap 'restore; exit 130' INT
          trap 'restore; exit 143' TERM
          trap restore EXIT
          cd "$RUNNER_TEMP"
          mv "$GITHUB_WORKSPACE" "$HIDDEN"

          RES="$VERIFY/NarraNexus.app/Contents/Resources/resources"
          PY="$RES/python/bin/python3"
          PROJ="$RES/project"
          # The environment a Finder-launched .app gives its sidecars, and no
          # more. PATH: the bundled node dirs + the on-demand plugin CLI dir
          # (state.rs resolve_bundled_node_bins(), in its order) + launchd's
          # minimal PATH (process_manager.rs). The node dirs are the FIRST of
          # resolve_bundled_node_bins()'s two candidates, `resources/nodejs` —
          # the one the real bundle has; if state.rs ever switches to the second
          # (`nodejs/`), change it here too. A runner PATH (Homebrew, a system
          # python, preinstalled CLIs) is strictly wider than any user's and
          # would hide a PATH-shaped dependency on this machine.
          export PATH="$RES/nodejs/bin:$RES/nodejs/node_modules/.bin:$VERIFY/home/.narranexus/plugins/nodejs/node_modules/.bin:/usr/bin:/bin:/usr/sbin:/sbin"
          # Nothing that selects a deployment mode may leak in from this runner:
          # with NARRANEXUS_DEPLOYMENT_MODE or DB_HOST set, backend decides it is
          # cloud and refuses to start without a JWT_SECRET — a failure no user
          # would ever see. Then what lib.rs + process_manager.rs set.
          unset NARRANEXUS_DEPLOYMENT_MODE DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME JWT_SECRET
          export HOME="$VERIFY/home" NARRA_SURFACE=desktop \
                 DATABASE_URL="sqlite:///$VERIFY/verify.db" \
                 SQLITE_PROXY_URL=http://localhost:8100 SQLITE_PROXY_PORT=8100

          fail() {  # fail <name> <message> — print that sidecar's log, then fail
            echo "--- $1 log ---"; cat "$VERIFY/$1.log" 2>/dev/null || true
            echo "::error::$2"; exit 1
          }

          echo "--- import smoke, run from the relocated app, checkout hidden ---"
          # Explicit failure path, not only `set -e`: this is the one command
          # that reproduces the v1.21.3 failure directly, so it must not be
          # softenable by a stray `|| true`. The script prints its own problem list.
          "$PY" "$PROJ/scripts/release/bundle_import_smoke.py" \
            || { echo "::error::the relocated app failed the import smoke (problem list above)"; exit 1; }

          launch() {  # launch <name> <command...>   (cwd = project, like state.rs)
            name="$1"; shift
            ( cd "$PROJ" && exec "$@" ) >"$VERIFY/$name.log" 2>&1 &
            LAST_PID=$!
            PIDS="$PIDS $LAST_PID:$name"
          }
          port_free() {  # port_free <name> <port> — refuse to test on a taken port
            if nc -z 127.0.0.1 "$2" 2>/dev/null; then
              echo "::error::port $2 is already in use before $1 starts — an open port afterwards would prove nothing"
              lsof -nP -iTCP:"$2" -sTCP:LISTEN || true
              exit 1
            fi
          }
          wait_port() {  # wait_port <name> <port> <pid> <limit-seconds>
            for _ in $(seq 1 "$4"); do
              if nc -z 127.0.0.1 "$2" 2>/dev/null; then
                # The port being open is only evidence if OUR process is the one
                # holding it: a sidecar that died on "address already in use"
                # leaves someone else's listener answering.
                sleep 2
                kill -0 "$3" 2>/dev/null || fail "$1" "$1 exited right after :$2 opened"
                return 0
              fi
              kill -0 "$3" 2>/dev/null || fail "$1" "$1 exited before binding :$2"
              sleep 1
            done
            fail "$1" "$1 did not bind :$2 within $4s (process still alive)"
          }
          # 8100 / 8000 are state.rs's `port: Some(..)`; 7801 is MCP_PORT's
          # default (module_system/base.py); 47831 is HEALTHZ_PORT
          # (channel/channel_health_server.py). Change one there, change it here.
          for pair in sqlite_proxy:8100 backend:8000 mcp:7801 workers:47831; do
            port_free "${pair%%:*}" "${pair##*:}"
          done

          echo "--- 1/4 sqlite_proxy ---"
          launch sqlite_proxy "$PY" -m narranexus.platform.utils.db.sqlite_proxy_server
          wait_port sqlite_proxy 8100 "$LAST_PID" 90

          echo "--- 2/4 backend ---"
          launch backend env DASHBOARD_BIND_HOST=127.0.0.1 "$PY" -m uvicorn backend.main:app \
            --host 127.0.0.1 --port 8000 --ws-ping-interval 30 --ws-ping-timeout 60
          wait_port backend 8000 "$LAST_PID" 90
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1:8000/docs || true)"
          [ "$code" = "200" ] || fail backend "backend /docs answered $code, expected 200"

          # mcp and workers get 150s: state.rs itself gates neither on a port or
          # a health check, so this step is deliberately stricter than the
          # product — and must not flake into being softened.
          echo "--- 3/4 mcp ---"
          launch mcp "$PY" src/narranexus/platform/module_system/module_runner.py mcp
          wait_port mcp 7801 "$LAST_PID" 150

          echo "--- 4/4 workers ---"
          # The supervisor serves its channel health endpoint once every worker
          # has started, so that — not a fixed sleep — is the readiness signal.
          launch workers "$PY" -m narranexus.platform.module_system.run_worker_supervisor
          WORKERS_PID="$LAST_PID"
          wait_port workers 47831 "$WORKERS_PID" 150
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1:47831/healthz || true)"
          [ "$code" = "200" ] || fail workers "workers /healthz answered $code, expected 200"
          sleep 10

          # Every sidecar still up, by name.
          for entry in $PIDS; do
            kill -0 "${entry%%:*}" 2>/dev/null || fail "${entry##*:}" "${entry##*:} died during verification"
          done
          # No sidecar raised OR LOGGED the failure class this step exists for.
          # Two shapes, both matched: an uncaught exception line (`<Type>: msg`
          # at the start of the line ending a traceback), and the message text
          # of one that was caught and logged — the supervisor and the plugin
          # hooks catch a broken import and log `... spec failed: {exc}`, which
          # renders only the message (`cannot import name ...`, `No module named
          # ...`). That caught path is the one ports and /healthz cannot see: the
          # service comes up with a channel or plugin silently missing. The bare
          # words ImportError/ModuleNotFoundError are deliberately NOT matched —
          # a warning that merely names them must not fail a build.
          # DEBUG-level lines are excluded: they are optional-feature probes, not
          # failures (litellm logs `Unable to import GenericAPILogger ... No
          # module named 'litellm_enterprise'` at DEBUG on every start). Three
          # DEBUG spellings reach these logs: litellm's `LiteLLM:DEBUG:`,
          # loguru's `| DEBUG |`, and stdlib basicConfig's `DEBUG:name:msg`.
          # The two shapes we fail on never carry a DEBUG level: caught ones are
          # logged at WARNING/ERROR, uncaught ones print the bare exception line.
          # One awk, not `grep -v | grep -q`: under pipefail a grep -q that
          # matches early SIGPIPEs the grep before it, and the pipeline reports
          # FAILURE — i.e. a real match would read as "clean".
          # Iterates $PIDS (launch order, names attached) rather than a
          # hand-kept list, so a new sidecar's log is scanned automatically.
          # awk's exit code has THREE meanings here, kept apart: 0 = a failure
          # line was found, 1 = clean, anything else = awk itself did not run
          # (parse error, unreadable file). Folding the last into "clean" would
          # make this the one gate whose green does not prove it ran — and the
          # release runs macOS's BWK awk, which no local test exercises.
          for entry in $PIDS; do
            name="${entry##*:}"
            rc=0
            awk '!/:DEBUG|\| DEBUG |^DEBUG:/ && /^(ModuleNotFoundError|ImportError): |cannot import name |No module named / { hit = 1 } END { exit !hit }' "$VERIFY/$name.log" || rc=$?
            case "$rc" in
              0) fail "$name" "$name raised or logged an import failure" ;;
              1) ;;
              *) fail "$name" "the log scan itself failed on $name.log (awk exit $rc) — this gate did not run" ;;
            esac
          done
          echo "All four sidecars came up from the relocated app with the checkout hidden."

      # On any failure in this job (`failure()` is job-level, not "the step
      # above"): the verification's sidecar logs, which live under
      # $RUNNER_TEMP (not the workspace) and vanish with the runner. If the
      # failure came earlier and verification never ran, the directory does
      # not exist and if-no-files-found: ignore makes this a no-op. fail()
      # prints the log that failed; this keeps all four, so a failure after
      # notarization can be read without paying for another one.
      - name: Collect relocated-app sidecar logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relocated-app-sidecar-logs
          path: ${{ runner.temp }}/relocated/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Normalize artifact filenames (stable name across versions)
        run: |
          set -euo pipefail
          DMG_DIR="tauri/src-tauri/target/release/bundle/dmg"
          mkdir -p dist
          cp "$DMG_DIR/NarraNexus.dmg" dist/NarraNexus.dmg
          cp "$DMG_DIR/NarraNexus.zip" dist/NarraNexus.zip
          # Preserve the notarization submission ID + log so we can re-query
          # Apple later if there's a downstream report of "rejected on Mac X".
          [ -f "$DMG_DIR/notarize-submission-id.txt" ] && cp "$DMG_DIR/notarize-submission-id.txt" dist/ || true
          [ -f "$DMG_DIR/notarize-latest.log" ]       && cp "$DMG_DIR/notarize-latest.log"       dist/ || true
          ls -la dist

      # Auto-update artifact. Built from the *notarized* .app (NOT via
      # createUpdaterArtifacts during the build, which would archive the
      # pre-notarized .app from before the canonical script re-signs it):
      #   1. tar+gzip the final .app
      #   2. sign the archive with the Tauri updater key → .app.tar.gz.sig
      #   3. write latest.json (version + signature + download URL) that the
      #      updater plugin fetches from the release `latest` endpoint.
      # Skipped (with a warning) when TAURI_SIGNING_PRIVATE_KEY is absent so a
      # fork without the secret still builds the dmg.
      - name: Build + sign updater artifact (latest.json)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set — skipping updater artifact (auto-update not published for this build)."
            exit 0
          fi
          APP_DIR="tauri/src-tauri/target/release/bundle/macos"
          [ -d "$APP_DIR/NarraNexus.app" ] || { echo "::error::NarraNexus.app not found at $APP_DIR"; exit 1; }
          tar -czf dist/NarraNexus.app.tar.gz -C "$APP_DIR" NarraNexus.app
          npx --yes @tauri-apps/cli@2.12.2 signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" \
            dist/NarraNexus.app.tar.gz
          SIG="$(cat dist/NarraNexus.app.tar.gz.sig)"
          # Tag push → real version; branch test build → synthetic so the JSON is valid.
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "${GITHUB_REF_NAME}" ] && VERSION="0.0.0-$(date -u +%Y%m%d%H%M%S)"
          cat > dist/latest.json <<JSON
          {
            "version": "$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIG",
                "url": "https://github.com/NetMindAI-Open/NarraNexus/releases/download/${GITHUB_REF_NAME}/NarraNexus.app.tar.gz"
              }
            }
          }
          JSON
          echo "--- latest.json ---"; cat dist/latest.json
          ls -la dist

      # Always upload as artifact so branch builds (signing tests) can be
      # downloaded and verified locally with codesign / spctl / stapler.
      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NarraNexus-dmg
          path: |
            dist/NarraNexus.dmg
            dist/NarraNexus.zip
            dist/NarraNexus.app.tar.gz
            dist/NarraNexus.app.tar.gz.sig
            dist/latest.json
            dist/notarize-submission-id.txt
            dist/notarize-latest.log
          retention-days: 14
          if-no-files-found: warn

      # Only attach to GitHub Release on tag push (skip on branch test runs).
      # Tag-triggered releases are published immediately and marked Latest so
      # users see the most recent build front-and-center on the Releases page.
      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NarraNexus.dmg
            dist/NarraNexus.zip
            dist/NarraNexus.app.tar.gz
            dist/latest.json
